services:
  - type: web
    name: wedding
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-db
          property: connectionString
      - key: ADMIN_PASSWORD
        value: "1234"

databases:
  - name: wedding-db
    plan: free
    region: frankfurt
    databaseName: wedding
    user: wedding
    ipAllowList: []
